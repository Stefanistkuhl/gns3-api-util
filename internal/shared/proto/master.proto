syntax = "proto3";
package master;

option go_package = "github.com/0xveya/gns3util/internal/shared/pb/master";

message PermissionCheckRequest {
  string user_id = 1;
  string jti = 2;
  string scope = 3;
}

message PermissionCheckResponse {
  bool allowed = 1;
}

service MasterSyncService {
  rpc CheckPermission(PermissionCheckRequest) returns (PermissionCheckResponse);
}
