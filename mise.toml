[env]
BUILD_DIR = "dist"
VERSION = "{{exec(command='git describe --tags --always --dirty')}}"
_.file = ".env"

[tools]
go = "1.25.7"
sqlite = "3.51.2"
golangci-lint = "2.10.1"
sqlc = "1.30.0"
goreleaser = "2.14.1"
protoc = "29.6"
buf = "1.66.0"
air = "1.62.0"
"github:nrempel/sleek" = "v0.5.0"
"go:mvdan.cc/gofumpt" = "0.9.2"
"go:golang.org/x/tools/cmd/goimports" = "0.42.0"
"go:google.golang.org/protobuf/cmd/protoc-gen-go" = "v1.36.5"
"go:storj.io/drpc/cmd/protoc-gen-go-drpc" = "v0.0.34"
"go:github.com/swaggo/swag/cmd/swag" = "latest"
bun = "1.3.5"

[tasks.test]
description = "Run tests"
run = "go test ./..."

[tasks.run-cli]
description = "run cli"
run = "go run ./cmd/gns3util/main.go"

[tasks.build-cli]
description = "Build for current platform"
run = "go build -v -o $BUILD_DIR/gns3util ./cmd/gns3util"

[tasks.run-master]
description = "Start the master node"
run = "go run ./cmd/master"
env = { CLUSTER_PRIV_KEY = "" }

[tasks.run-filestore]
description = "Start the filestore node"
run = "go run ./cmd/file-store"

[tasks.run-cluster]
description = "run cluster components"
depends = ["run-master", "run-filestore"]

[tasks.build-all]
description = "Build for all platforms using Goreleaser"
run = "goreleaser build --snapshot --clean"

[tasks.clean]
description = "Clean build artifacts"
run = ["rm -rf $BUILD_DIR", "rm -f $BINARY_NAME"]

[tasks.test-release]
description = "Create a test release (dry run)"
run = "goreleaser release --snapshot --clean"

[tasks.format]
description = "Run all formatters (Go and SQL)"
depends = ["format-go", "format-sql", "format-proto", "format-swag"]

[tasks."format-go"]
description = "Format Go code with goimports and gofumpt"
run = ["goimports -w .", "gofumpt -w .", "go mod tidy"]

[tasks.format-sql]
description = "Format SQL files"
run = [
  "sleek './internal/cli/cli_pkg/cluster/db/querys/*.sql'",
  "sleek './internal/cli/cli_pkg/cluster/db/schema.sql'",
]

[tasks."format-proto"]
description = "Format protobuf files with buf"
run = "buf format internal/shared/proto -w"

[tasks."format-swag"]
description = "Format swagger api docs"
run = "swag fmt"

[tasks.lint]
description = "Run all linters"
depends = ["lint-go", "lint-proto"]

[tasks."lint-go"]
description = "Run Go linter"
run = "golangci-lint run -c .golangci.yml"

[tasks."lint-proto"]
description = "Run protobuf linter"
run = "buf lint internal/shared/proto"

[tasks.dev-cluster]
description = "Run all dev tasks"
depends = ["dev-master", "dev-filestore"]

[tasks.dev-master]
description = "Run all dev master tasks"
run = "air -c air-master.toml"

[tasks.dev-filestore]
description = "Run all dev filestore tasks"
run = "air -c air-file-store.toml"

[tasks.sqlc]
description = "Generate SQL files"
run = "sqlc generate"

[tasks.swag]
description = "Generate swagger api docs"
run = "swag init -g main.go -d ./cmd/master,./internal/master/handlers,./pkg/models,./pkg/web/helpers"

[tasks.proto]
description = "Generate all protobuf and dRPC files"
run = "buf generate internal/shared/proto --template internal/shared/proto/buf.gen.yaml"

[tasks.generate]
description = "Generate all files"
depends = ["sqlc", "proto", "swag"]

[tasks.release]
description = "Create a production release"
run = "goreleaser release --clean"

[tasks."docs:gen-cli"]
description = "Generate CLI documentation from Cobra"
run = "go run ./tools/gendocs"
dir = "."

[tasks.docs]
description = "Generate all documentation (CLI + OpenAPI)"
run = [
  "bunx swagger2openapi docs/swagger.json -o docs/openapi.json",
  "mkdir -p documentation/api-reference",
  "cp docs/openapi.json documentation/api-reference/gns3util-master-api-docs.json",
  "go run ./tools/gendocs",
  "echo 'Docs generated successfully'"
]
depends = ["swag", "docs:gen-cli"]

[tasks."docs-serve"]
description = "Serve docs locally"
run = [
  "bunx --bun mint dev",
]
dir = "documentation"
depends = ["docs"]
