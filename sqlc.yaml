version: "2"
sql:
  - engine: "sqlite"
    queries:
      - "./internal/cli/cli_pkg/cluster/db/querys/inserts.sql"
      - "./internal/cli/cli_pkg/cluster/db/querys/selects.sql"
      - "./internal/cli/cli_pkg/cluster/db/querys/updates.sql"
      - "./internal/cli/cli_pkg/cluster/db/querys/deletes.sql"
    schema: "./internal/cli/cli_pkg/cluster/db/schema.sql"
    gen:
      go:
        package: "sqlc"
        out: "./internal/cli/cli_pkg/cluster/db/sqlc"
        sql_package: "database/sql"
        emit_interface: true
        emit_empty_slices: true
        emit_json_tags: true

  - engine: "sqlite"
    queries:
      - "./internal/file-store/db/queries/inserts.sql"
      - "./internal/file-store/db/queries/selects.sql"
      - "./internal/file-store/db/queries/updates.sql"
      - "./internal/file-store/db/queries/deletes.sql"
    schema: "./internal/file-store/db/schema.sql"
    gen:
      go:
        package: "sqlc_file_store"
        out: "./internal/file-store/db/sqlc_file_store"
        sql_package: "database/sql"
        emit_interface: true
        emit_empty_slices: true
        emit_json_tags: true
        overrides:
          - column: "files.STATUS"
            go_type:
              type: "FileStatus"
              import: "github.com/0xveya/gns3util/pkg/models"

          - column: "files.created_at"
            go_type:
              type: string

          - column: "files.updated_at"
            go_type:
              type: string

          - column: "files.last_accessed_at"
            go_type:
              type: string

          - column: "buckets.created_at"
            go_type:
              type: string

          - column: "buckets.updated_at"
            go_type:
              type: string

          - column: "public_file_tokens.created_at"
            go_type:
              type: string

          - column: "public_file_tokens.expires_at"
            go_type:
              type: string
