# yaml-language-server: $schema=../schema.json
version: 1

package:
  id: backups
  title: Backups
  service: filestore
  source:
    vcs: jj
    commit_id: fe59faa7100494941bf73713e25e0715a17764fe
    change_id: pztrunuwlnqurputqrnykpwqrwqmyoro
    summary: added endpoints for backups in the filestore

client:
  target_file: pkg/api/client_v2.go
  default_section: backups
  endpoint_group: backups

cli:
  target_file: internal/cli/cmds/ctlcmd/objstorecmd/backups.go
  parent_file: internal/cli/cmds/ctlcmd/objstorecmd/obj.go
  parent_factory: NewObjCmd
  command_factory: NewBackupsCmd
  use: backups
  aliases: [backup]
  short: Manage backup objects in the filestore
  auth_mode: cluster-only
  group_id: object
  groups:
    - id: query
      title: "Query commands:"
    - id: action
      title: "Action commands:"
  rows:
    - type: backupRow
      fields:
        - name: FileUUID
          header: FILE UUID
        - name: Filename
          header: FILENAME
        - name: Status
          header: STATUS
        - name: BackupType
          json: backup_type
          header: BACKUP TYPE
        - name: SourceNodeID
          json: source_node_id
          header: SOURCE NODE
        - name: IsCompressed
          type: bool
          json: is_compressed
          header: COMPRESSED
        - name: IsEncrypted
          type: bool
          json: is_encrypted
          header: ENCRYPTED
        - name: ParentBackupUUID
          json: parent_backup_uuid
          header: PARENT BACKUP
        - name: CreatedAt
          type: time.Time
          header: CREATED AT
          value: b.CreatedAt.Format(time.RFC3339)
    - type: backupUploadResult
      fields:
        - name: FileUUID
          header: FILE UUID
        - name: Status
          header: STATUS
    - type: backupDeleteResult
      fields:
        - name: FileUUID
          header: FILE UUID
        - name: Status
          header: STATUS

client_methods:
  - id: list_backups
    section: backups
    method: ListBackups
    http_method: GET
    url_expr: '"/backups"'
    response:
      pointer_type: "*models.ListBackupsResponse"
      value_type: "models.ListBackupsResponse"
      decode_var: resp
      decode_error: "failed to decode backups"

  - id: init_backup_upload
    section: backups
    method: InitBackupUpload
    http_method: POST
    url_expr: '"/backups"'
    request:
      body: true
      arg_name: req
      type: "*models.InitBackupUploadRequest"
    response:
      pointer_type: "*models.InitUploadResponse"
      value_type: "models.InitUploadResponse"
      decode_var: resp
      decode_error: "failed to decode backup upload init response"

  - id: get_backup
    section: backups
    method: GetBackup
    http_method: GET
    args:
      - name: fileUUID
        type: string
    url_expr: 'fmt.Sprintf("/backups/%s", fileUUID)'
    response:
      pointer_type: "*models.BackupInfo"
      value_type: "models.BackupInfo"
      decode_var: resp
      decode_error: "failed to decode backup"

  - id: update_backup
    section: backups
    method: UpdateBackup
    http_method: PATCH
    args:
      - name: fileUUID
        type: string
    request:
      body: true
      arg_name: req
      type: "*models.UpdateBackupRequest"
    url_expr: 'fmt.Sprintf("/backups/%s", fileUUID)'
    response:
      pointer_type: "*models.BackupInfo"
      value_type: "models.BackupInfo"
      decode_var: resp
      decode_error: "failed to decode updated backup"

  - id: delete_backup
    section: backups
    method: DeleteBackup
    http_method: DELETE
    args:
      - name: fileUUID
        type: string
    url_expr: 'fmt.Sprintf("/backups/%s", fileUUID)'
    response:
      pointer_type: "*models.DeleteFileResponse"
      value_type: "models.DeleteFileResponse"
      decode_var: resp
      decode_error: "failed to decode backup delete response"

cli_commands:
  - id: list_backups
    factory: newListBackupsCmd
    use: list
    short: List backup objects
    group_id: query
    cobra_args: cobra.NoArgs
    client_method: ListBackups
    output:
      response_field: Backups
      row_type: backupRow
      empty_message: No backups found.

  - id: get_backup
    factory: newGetBackupCmd
    use: get <file-uuid>
    short: Get backup details
    group_id: query
    cobra_args: cobra.ExactArgs(1)
    client_method: GetBackup
    positionals:
      - name: fileUUID
        usage: Backup file UUID
        client_arg: fileUUID
    output:
      row_type: backupRow

  - id: upload_backup
    factory: newUploadBackupCmd
    use: upload <file-path>
    aliases: [add]
    short: Upload a backup object
    group_id: action
    cobra_args: cobra.ExactArgs(1)
    client_method: InitBackupUpload
    positionals:
      - name: filePath
        usage: Local backup file path
    flags:
      - name: type
        shorthand: t
        type: string
        default: application/octet-stream
        usage: Explicit Content-Type for the backup file
        model_field: ContentType
      - name: retention
        shorthand: r
        type: int64
        usage: Retention period in hours
        model_field: RetentionPeriod
      - name: bucket-id
        type: string
        usage: Target bucket ID
        model_field: BucketID
      - name: source-node-id
        type: string
        usage: Source node ID for this backup
        model_field: SourceNodeID
      - name: backup-type
        type: string
        required: true
        usage: "Backup type: full or incremental"
        model_field: BackupType
      - name: compressed
        type: bool
        usage: Mark the backup as compressed
        model_field: IsCompressed
      - name: encrypted
        type: bool
        usage: Mark the backup as encrypted
        model_field: IsEncrypted
      - name: parent-backup-uuid
        type: string
        usage: Parent backup UUID for incremental backups
        model_field: ParentBackupUUID
    output:
      row_type: backupUploadResult

  - id: update_backup
    factory: newUpdateBackupCmd
    use: update <file-uuid>
    short: Update backup metadata
    group_id: action
    cobra_args: cobra.ExactArgs(1)
    client_method: UpdateBackup
    positionals:
      - name: fileUUID
        usage: Backup file UUID
        client_arg: fileUUID
    flags:
      - name: source-node-id
        type: string
        usage: Source node ID for this backup
        model_field: SourceNodeID
      - name: backup-type
        type: string
        usage: "Backup type: full or incremental"
        model_field: BackupType
      - name: compressed
        type: bool
        usage: Set whether the backup is compressed
        model_field: IsCompressed
      - name: encrypted
        type: bool
        usage: Set whether the backup is encrypted
        model_field: IsEncrypted
      - name: parent-backup-uuid
        type: string
        usage: Parent backup UUID for incremental backups
        model_field: ParentBackupUUID
    output:
      row_type: backupRow

  - id: delete_backup
    factory: newDeleteBackupCmd
    use: delete <file-uuid>
    aliases: [rm]
    short: Delete a backup object
    group_id: action
    cobra_args: cobra.ExactArgs(1)
    client_method: DeleteBackup
    positionals:
      - name: fileUUID
        usage: Backup file UUID
        client_arg: fileUUID
    output:
      row_type: backupDeleteResult
